<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Getting to Trial</title>
    <script>
      // Pick light/dark and the colour theme before the page draws, so it never
      // flashes the wrong one. Keep in sync with src/theme/theme.ts: light/dark
      // follows the computer unless toggled earlier in this visit; the colour
      // theme is the user's last choice on this device.
      try {
        var mode = sessionStorage.getItem('theme')
        var dark = mode ? mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
      try {
        var palette = localStorage.getItem('palette')
        if (/^(navy|slate|earth|vibrant|forest|lagoon|contrast)$/.test(palette || '')) document.documentElement.dataset.palette = palette
      } catch (e) {}
    </script>
    <!-- Fonts for the course workspace (src/workspace). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
